<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMA</title>
    <link rel = "stylesheet" href = "style.css" >
    <style>
        /* Base Reset */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

main {
  flex: 1;
}

body {
  background-color: #0d0e12;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: #ffffff;
  min-height: 100%;
  position: relative;
  padding-bottom: 250px; /* Gives space so content won't overlap the footer */
}
html {
  height: 100%;
}

/* Header Container */
.site-header {
  width: 100%;
  background-color: #0b0c0e;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  position: sticky;
  top: 0;
  z-index: 1000;
}

.navbar {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between; /* Pushes Logo to Left, Search/Profile to Right */
  padding: 0.85rem 2rem;
  height: 64px;
  gap: 2rem; /* Guarantees a minimum distance between elements */
}

/* Far Left: Logo */
.brand-logo {
  font-size: 1.25rem;
  font-weight: 800;
  letter-spacing: 1.5px;
  color: #ffffff;
  text-decoration: none;
  flex-shrink: 0; /* Prevents logo from shrinking */
}

/* Middle: Nav Links */
.nav-menu {
  display: flex;
  list-style: none;
  gap: 2rem;
  margin-left: 3rem; /* Adds additional space after the logo */
  margin-right: auto; /* Pushes the right section all the way to the end */
}

.nav-link {
  color: #94a3b8;
  text-decoration: none;
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  transition: color 0.2s ease;
}

.nav-link:hover,
.nav-link.active {
  color: #ffffff;
}

/* Far Right: Search & Profile */
.nav-right {
  display: flex;
  align-items: center;
  gap: 1.25rem;
  flex-shrink: 0;
}

/* Search Box */
.search-box {
  position: relative;
  display: flex;
  align-items: center;
  background-color: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 6px;
  padding: 0.4rem 0.75rem;
  width: 240px;
  transition: border-color 0.2s ease, background-color 0.2s ease;
}

.search-box:focus-within {
  border-color: rgba(255, 255, 255, 0.3);
  background-color: rgba(255, 255, 255, 0.08);
}

.search-icon {
  width: 14px;
  height: 14px;
  stroke: #64748b;
  margin-right: 8px;
  flex-shrink: 0;
}

.search-box input {
  background: transparent;
  border: none;
  outline: none;
  color: #ffffff;
  font-size: 0.8rem;
  width: 100%;
}

.search-box input::placeholder {
  color: #64748b;
}

.kbd-shortcut {
  font-size: 0.65rem;
  color: #64748b;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  padding: 1px 5px;
  border-radius: 4px;
  font-family: inherit;
  font-weight: 600;
}

/* Profile Icon Button */
.profile-btn {
  background: transparent;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 50%;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: border-color 0.2s ease, background-color 0.2s ease;
}

.profile-btn svg {
  width: 16px;
  height: 16px;
  stroke: #94a3b8;
  transition: stroke 0.2s ease;
}

.profile-btn:hover {
  border-color: rgba(255, 255, 255, 0.3);
  background-color: rgba(255, 255, 255, 0.05);
}

.profile-btn:hover svg {
  stroke: #ffffff;
}

/* Responsive Behavior */
@media (max-width: 768px) {
  .nav-menu {
    display: none;
  }
  .search-box {
    width: 160px;
  }
}
/* Footer Base Container */
.site-footer {
  position: absolute;
  bottom: 0;
  width: 100%;
  background-color: #08080a; /* Dark sleek background matching your theme */
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  padding: 4rem 2rem 3rem;
  color: #ffffff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

/* Inner Layout Grid */
.footer-container {
  max-width: 1400px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(3, 1fr) 1.5fr; /* 3 menu columns + 1 brand column */
  gap: 2rem;
}

/* Column Headings */
.footer-heading {
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 1.5px;
  color: #ffffff;
  margin-bottom: 1.5rem;
  text-transform: uppercase;
}

/* Navigation Link Lists */
.footer-links {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.footer-links a {
  color: #8b929e;
  text-decoration: none;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  transition: color 0.2s ease;
}

.footer-links a:hover {
  color: #ffffff;
}

/* Brand Column (Far Right) */
.footer-brand-col {
  text-align: right;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
}

.footer-logo {
  font-size: 2rem;
  font-weight: 800;
  letter-spacing: 2px;
  color: #ffffff;
  margin-bottom: 0.75rem;
  line-height: 1;
}

.tagline {
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 1.2px;
  color: #8b929e;
  margin-bottom: 0.5rem;
  text-transform: uppercase;
}

.copyright {
  font-size: 0.6rem;
  font-weight: 700;
  letter-spacing: 1px;
  color: #525866;
  line-height: 1.4;
  text-transform: uppercase;
}

/* Mobile Responsiveness */
@media (max-width: 768px) {
  .footer-container {
    grid-template-columns: repeat(2, 1fr);
    gap: 3rem 1.5rem;
  }

  .footer-brand-col {
    text-align: left;
    align-items: flex-start;
    grid-column: span 2;
  }
}
    </style>
</head>
<body>
<header class="site-header">
  <nav class="navbar">
    <!-- 1. Logo (Far Left) -->
    <a href="#" class="brand-logo">LUMA</a>

    <!-- 2. Main Navigation Links (Middle / Spaced) -->
    <ul class="nav-menu">
      <li><a href="#" class="nav-link">MOVIES</a></li>
      <li><a href="#" class="nav-link">THEATERS</a></li>
      <li><a href="#" class="nav-link">CONCESSIONS</a></li>
    </ul>

    <!-- 3. Search & Profile (Far Right) -->
    <div class="nav-right">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" placeholder="Search movies..." aria-label="Search movies">
        <span class="kbd-shortcut">⌘K</span>
      </div>

      <button class="profile-btn" aria-label="User Account">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </button>
    </div>
  </nav>
</header>

<footer class="site-footer">
  <div class="footer-container">
    <!-- Column 1: Experience -->
    <div class="footer-col">
      <h4 class="footer-heading">EXPERIENCE</h4>
      <ul class="footer-links">
        <li><a href="#">IMAX LASER</a></li>
        <li><a href="#">DOLBY CINEMA</a></li>
        <li><a href="#">THE LOUNGE</a></li>
      </ul>
    </div>

    <!-- Column 2: Company -->
    <div class="footer-col">
      <h4 class="footer-heading">COMPANY</h4>
      <ul class="footer-links">
        <li><a href="#">ABOUT LUMA</a></li>
        <li><a href="#">CAREERS</a></li>
        <li><a href="#">PRESS</a></li>
      </ul>
    </div>

    <!-- Column 3: Social -->
    <div class="footer-col">
      <h4 class="footer-heading">SOCIAL</h4>
      <ul class="footer-links">
        <li><a href="#">INSTAGRAM</a></li>
        <li><a href="#">TWITTER / X</a></li>
      </ul>
    </div>

    <!-- Column 4: Brand & Copyright -->
    <div class="footer-col footer-brand-col">
      <h2 class="footer-logo">LUMA</h2>
      <p class="tagline">CINEMA, DISTILLED.</p>
      <p class="copyright">&copy; 2026 LUMA CINEMA GROUP.<br>ALL RIGHTS RESERVED.</p>
    </div>
  </div>
</footer>

</body>
</html>
