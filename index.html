<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    .container {
      display: flex;
      gap: 15px;
    }

    .box {
      width: 100px;
      height: 100px;
      background-color: #3498db; /* Default: Blue */
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    /* Active flipped state */
    .box.flipped {
      background-color: #e74c3c; /* Active: Red */
    }
  </style>
</head>
<body>

  <!-- Parent container wrapping all divs -->
  <div id="boxContainer" class="container">
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
  </div>

  <script>
    // 1. Target the parent container
    const container = document.getElementById('boxContainer');

    // 2. Listen for clicks on the container
    container.addEventListener('click', (event) => {
      // 3. Check if the clicked element is one of the boxes
      if (event.target.classList.contains('box')) {
        // 4. Toggle the flipped class on ONLY the clicked box
        event.target.classList.toggle('flipped');
      }
    });
  </script>

</body>
</html>
